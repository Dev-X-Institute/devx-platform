name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject non-npm lockfiles
        run: |
          if find . -type f \( -name pnpm-lock.yaml -o -name yarn.lock \) -print -quit | grep -q .; then
            echo "Only package-lock.json is allowed. Remove other package-manager lockfiles."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Report high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true
